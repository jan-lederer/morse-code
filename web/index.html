<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Learn Morse code, one small signal at a time. An interactive tree, touch practice, and your own rhythm.">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="dit.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>dit. — Learn Morse code</title>
  <style>html,body{margin:0;background:#f6f5f1}#loading{height:100vh;display:grid;place-content:center;text-align:center;font-family:Arial,sans-serif;color:#26302f}#loading b{font-size:64px;letter-spacing:-4px}#loading b span{color:#e77860}#loading p{color:#8a918b;font-size:12px;letter-spacing:2px}</style>
  <script>
    let ditAudio, ditOscillator;
    window.ditLoad = () => {try{return localStorage.getItem('dit-state')}catch{return null}};
    window.ditSave = value => {try{localStorage.setItem('dit-state',value)}catch{}};
    window.ditCanVibrate = () => typeof navigator.vibrate === 'function';
    window.ditVibrate = duration => {try{navigator.vibrate?.(duration)}catch{}};
    window.ditTone = enabled => {
      try {
        if(ditOscillator){ditOscillator.stop();ditOscillator.disconnect();ditOscillator=null}
        if(!enabled)return;
        ditAudio ||= new (window.AudioContext || window.webkitAudioContext)();
        ditAudio.resume();
        const gain=ditAudio.createGain();gain.gain.value=.12;
        ditOscillator=ditAudio.createOscillator();ditOscillator.frequency.value=620;
        ditOscillator.connect(gain);gain.connect(ditAudio.destination);ditOscillator.start();
      }catch{}
    };
    window.addEventListener('blur',()=>window.ditTone(false));
    window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());
  </script>
</head>
<body>
  <div id="loading"><b>dit<span>.</span></b><p>SMALL SIGNALS. BIG POSSIBILITIES.</p></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
